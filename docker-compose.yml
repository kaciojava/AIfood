services:
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=postgres-auth

  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGO_URI=mongodb://mongo:27017/catalog_db

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DB_HOST=postgres-orders

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DB_HOST=postgres-payments

  frontend-service:
    build: ./frontend-service
    container_name: delivery-frontend
    ports:
      - "80:80"

  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"

  mongo:
    image: mongo:latest
    container_name: mongo-catalog
    ports:
      - "27017:27017"