<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AIfood - Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .auth-box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .card { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>AIfood - Delivery</h1>
    
    <div id="auth-section" class="auth-box">
        <h3>Login</h3>
        <input type="email" id="email" placeholder="seu@email.com">
        <input type="password" id="pass" placeholder="Senha">
        <button onclick="login()">Entrar</button>
    </div>

    <div id="catalog" style="display:none;">
        <h2>Cardápio</h2>
        <div id="items"></div>
    </div>

    <script>
        let authToken = null;

        async function login() {
            const email = document.getElementById('email').value;
            const res = await fetch('http://localhost:3001/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password: document.getElementById('pass').value })
            });
            
            if (res.ok) {
                const data = await res.json();
                authToken = data.token;
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('catalog').style.display = 'block';
                loadCatalog();
            } else {
                alert('Credenciais inválidas!');
            }
        }

        async function loadCatalog() {
            const response = await fetch('http://localhost:3002/products', {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            const data = await response.json();
            const container = document.getElementById('items');
            data.forEach(item => {
                container.innerHTML += `<div class="card"><h3>${item.name}</h3><button onclick="placeOrder('${item.id}')">Pedir</button></div>`;
            });
        }
        
        async function placeOrder(productId) {
            const res = await fetch('http://localhost:3003/orders', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({ product_id: productId, user_id: 1 })
            });
            if(res.ok) alert('Pedido realizado com sucesso!');
        }
    </script>
</body>
</html>
